[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "training-leetcode"
version = "1.0.0"
description = "A structured repository for practicing LeetCode problems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["leetcode", "algorithms", "data-structures", "coding-interview"]
authors = [
  {name = "Kenta Morimori"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Kenta-morimori/training-leetcode"
Repository = "https://github.com/Kenta-morimori/training-leetcode"
Issues = "https://github.com/Kenta-morimori/training-leetcode/issues"

[tool.ruff]
# Set the maximum line length
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "venv",
    "env",
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Use `\n` line endings
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["problems"]

[tool.pytest.ini_options]
testpaths = ["problems"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
